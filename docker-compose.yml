services:

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: communityhub_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - storage_framework:/var/www/html/storage/framework
      - storage_logs:/var/www/html/storage/logs
      - app_storage:/var/www/html/storage/app
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [communityhub]

  nginx:
    image: nginx:1.25-alpine
    container_name: communityhub_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [communityhub]

  postgres:
    image: postgres:16-alpine
    container_name: communityhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_DATABASE:-communityhub}
      POSTGRES_USER:     ${DB_USERNAME:-communityhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-communityhub}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [communityhub]

  redis:
    image: redis:7-alpine
    container_name: communityhub_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [communityhub]

  mailpit:
    image: axllent/mailpit:latest
    container_name: communityhub_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks: [communityhub]

  reverb:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: communityhub_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - storage_framework:/var/www/html/storage/framework
      - storage_logs:/var/www/html/storage/logs
      - bootstrap_cache:/var/www/html/bootstrap/cache
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: [app]
    networks: [communityhub]

  worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: communityhub_worker
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - storage_framework:/var/www/html/storage/framework
      - storage_logs:/var/www/html/storage/logs
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on: [app]
    networks: [communityhub]

  coturn:
    image: coturn/coturn:latest
    container_name: communityhub_coturn
    restart: unless-stopped
    command: >
      -n --log-file=stdout --fingerprint
      --listening-port=${TURN_PORT:-3478}
      --realm=${TURN_REALM:-communityhub}
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --min-port=49160 --max-port=49200
      --no-cli
    ports:
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURN_PORT:-3478}:3478/tcp"
      - "49160-49200:49160-49200/udp"
    networks: [communityhub]

  vite:
    image: node:22-alpine
    container_name: communityhub_vite
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    networks: [communityhub]

volumes:
  postgres_data:
  redis_data:
  vendor:
  storage_framework:
  storage_logs:
  app_storage:
  bootstrap_cache:
  node_modules:

networks:
  communityhub:
    driver: bridge
