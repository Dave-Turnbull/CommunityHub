server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    # nginx's own default (1M) is well under what an image/video upload needs and
    # would 413 before the request ever reaches PHP, regardless of what Laravel's
    # own validation allows. Keep this >= config/uploads.php's max_size_kb (see
    # UPLOAD_MAX_SIZE_KB) + a little headroom for multipart overhead — it's the
    # hard ceiling, not the user-facing limit; that one lives in config/uploads.php.
    client_max_body_size 110M;

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   app:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    location ~ /\. { deny all; }
}
