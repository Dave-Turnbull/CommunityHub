opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.revalidate_freq=0
opcache.save_comments=1

; Ceiling only, same as nginx's client_max_body_size; must stay >= config/uploads.php's
; max_size_kb (UPLOAD_MAX_SIZE_KB env var), which is the actual user-facing limit
; Laravel validates against.
upload_max_filesize=110M
post_max_size=115M
memory_limit=256M
max_execution_time=60
display_errors=Off
log_errors=On
date.timezone=UTC
